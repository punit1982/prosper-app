# Values come from core/ledger_ui.TOKENS["light"] — the same dict the design
# system's CSS is generated from, so Streamlit's own chrome and the components
# cannot drift apart.
#
# THIS MOVES WITH TWO OTHER THINGS. ledger_ui.ACTIVE_THEME selects the token
# set for both the CSS pin and the Plotly literals. Change one without the
# others and half the app paints on the wrong ground.
[theme]
primaryColor = "#0F172A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E8ECF1"
textColor = "#020617"
font = "sans serif"

[server]
maxUploadSize = 50
headless = true
# Streamlit's enableCORS is inverted vs. generic web servers: "true" means
# RESTRICT to same-origin (which we want), and is also REQUIRED for XSRF
# cookie protection to work. Keep both true.
enableCORS = true
enableXsrfProtection = true

[runner]
magicEnabled = false
fastReruns = true

[client]
# "minimal" removes Streamlit's own Deploy button and its dev-only toolbar
# items, which on a 375px phone was a 110px band of chrome above the first
# pixel of the app — the top 13% of every screen, spent on a button the owner
# of this app can never use.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[global]
suppressDeprecationWarnings = false
